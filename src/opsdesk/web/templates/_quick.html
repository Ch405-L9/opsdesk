<form method="post" action="/item/{{ i.wb_key }}/quick" class="quick">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <button class="btn small" name="action" value="done" title="Mark done">✓ Done</button>
  <button class="btn small ghost" name="action" value="snooze" title="Push 3 days">+3 days</button>
</form>
