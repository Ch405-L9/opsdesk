[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "opsdesk"
version = "1.0.0"
description = "Local-first command center for solo and small service businesses: leads, government bids, jobs, follow-ups."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "OpsDesk contributors" }]
dependencies = [
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "platformdirs>=4.2,<5",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1", "mypy>=1.11,<2", "types-PyYAML>=6,<7"]

[project.scripts]
opsdesk = "opsdesk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opsdesk"]

[tool.hatch.build.targets.sdist]
exclude = ["reference", "Build the OpsDesk local-first command center", "manus_token_exhausted_context.txt"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["reference", "Build the OpsDesk local-first command center"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/test_leads_*.py" = ["E701", "E702", "E741"]
"src/opsdesk/leads/*.py" = ["B904", "E701", "E702"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["src/opsdesk"]
exclude = ["src/opsdesk/leads/(providers|discovery|audit|budget|scoring|painpoints|outreach)\\.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=opsdesk --cov-report=term-missing:skip-covered --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["opsdesk"]
omit = ["*/__main__.py"]
