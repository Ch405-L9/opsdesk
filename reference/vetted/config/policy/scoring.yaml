# CareerOps Local - deterministic scoring policy.
# Policy source: docs/SCORING_DECISIONS.md, owner-decision records dated 2026-09-25
# (P-1 through P-6) and 2026-09-26 (A-5 through A-7). Those records are the active
# implementation authority.
# No scoring, classification, blocker detection, or reporting logic is implemented.

# Nine weighted dimensions. Must total exactly 100.
# The 15-point dimension is named per owner decision D-4: total years of experience
# is never calculated and never inferred from job dates.
weights:
  role_family_relevance: 20
  verified_technical_skill_alignment: 20
  responsibility_and_project_evidence_alignment: 15
  seniority_and_documented_evidence_compatibility: 15
  compensation_compatibility: 10
  location_remote_relocation_compatibility: 8
  employment_type_compatibility: 5
  employer_listing_validation_quality: 4
  growth_learning_relevance: 3

# P-1 (resolves A-4). Multipliers apply ONLY within verified_technical_skill_alignment
# and are capped at that dimension's 20-point weight (rule E-1). Best tier wins (E-3).
# Tier ordinal does not imply weight order: TIER_3 outranks TIER_2 (E-8).
evidence_tier_weighting:
  TIER_1_VERIFIED_SKILL: 1.00
  TIER_2_PROJECT_EVIDENCE: 0.70
  TIER_3_EMPLOYMENT_EVIDENCE: 0.90
  TIER_4_TRAINING: 0.30

# P-2 (resolves A-3). Global bands, inclusive on both ends, tiling 0-100.
# INSUFFICIENT_EVIDENCE deliberately has no score band: it is reachable only through
# the critical-unknown cap (rule C-4), never by score.
match_classification_thresholds:
  bands:
    - classification: STRONG_MATCH
      min_score: 72
      max_score: 100
    - classification: PLAUSIBLE_MATCH
      min_score: 58
      max_score: 71
    - classification: STRETCH
      min_score: 42
      max_score: 57
    - classification: AVOID
      min_score: 0
      max_score: 41

# P-3. Seniority and documented-evidence compatibility, 15 points.
# Total years of experience is never calculated and never inferred from job dates.
seniority_bands:
  bands:
    - points: 15
      description: >-
        Intermediate / Engineer I-II / associate role; responsibilities strongly match
        documented evidence; no unsupported leadership or research scope.
    - points: 11
      description: >-
        Mid-level role with one moderate gap, including a stated 3+ years requirement
        where the actual scope remains practical and applied.
    - points: 7
      description: Broad or unclear role, or multiple moderate evidence gaps.
    - points: 3
      description: >-
        Explicit 5+ years or senior-style scope, without enough evidence to establish
        the hard blocker.
    - points: 0
      description: >-
        Materially unsupported senior/staff/principal/lead/research scope; then evaluate
        the separate P-5 blocker, which requires its own additional conditions.

# P-6. Report section order. The score appears at position 5 and is never a headline.
report_display:
  order:
    - Recommendation
    - Hard blockers
    - Validation status and risk flags
    - Critical unknowns / missing evidence
    - Match classification and score
    - Per-dimension score breakdown
    - Evidence-tier map with candidate-proof references
    - Human next action
  score_never_headline: true

# A-5. Required-only conservative allocation, resolving
# technology_base_credit_allocation.
#   points = 20 x (sum of required-slot best-tier multipliers) / number of required slots
#   when there is at least one required slot; points = 0 when there are none.
# Required slots are counted only after approved normalization, any-of grouping, and
# deduplication. Preferred technologies never enter the numerator or the denominator.
# The result stays exact and unrounded: rounding remains score_rounding_rule.
# No allocation behaviour is implemented; this block is policy data only.
technology_base_credit_allocation:
  dimension: verified_technical_skill_alignment
  allocation: required_only_conservative
  zero_required_slots_points: 0
  preferred_in_numerator: false
  preferred_in_denominator: false
  unrecognized_required_term_credit: 0.00
  unrecognized_required_term_stays_in_denominator: true
  numerator_source: structured_technology_fields_only
  prose_token_scanning: false
  rounding: deferred_to_score_rounding_rule

# A-6. Controlled alias families with review queue, resolving
# technology_matching_normalization. Lookup keys are derived using only the four steps
# below. Alias matching is whole-phrase only and one-way, variant to canonical.
# Candidate-side compound and parenthetical parsing is deferred and is NOT performed:
# "Model Context Protocol (MCP)", "JavaScript/TypeScript", "Ubuntu/Linux",
# "Windows 10/11", and course titles are not parsed. No matching behaviour is
# implemented; this block is policy data only.
technology_matching_normalization:
  normalization_steps:
    - nfc
    - casefold
    - collapse_whitespace
    - trim
  whole_phrase_only: true
  alias_direction: variant_to_canonical
  unknown_alias_auto_match: false
  bare_two_letter_aliases_allowed: false
  candidate_side_compound_parsing: deferred
  unknown_term_handling: report_section_only
  persistent_review_queue: false
  canonical_technologies:
    - id: REACT
      display_name: 'React'
    - id: REST_APIS
      display_name: 'REST APIs'
    - id: MCP
      display_name: 'MCP'
    - id: RAG
      display_name: 'RAG'
    - id: CHROMADB
      display_name: 'ChromaDB'
    - id: BM25
      display_name: 'BM25'
    - id: PYTHON
      display_name: 'Python'
    - id: SQLITE
      display_name: 'SQLite'
    - id: BASH
      display_name: 'Bash'
  alias_families:
    - canonical_id: REACT
      approval_date: '2026-09-26'
      defense: 'Spelling variants of the identical library; dossier verifies React'
      variants:
        - 'react.js'
        - 'reactjs'
    - canonical_id: REST_APIS
      approval_date: '2026-09-26'
      defense: 'Grammatical and plural variants; dossier verifies REST APIs'
      variants:
        - 'rest api'
        - 'rest apis'
        - 'restful api'
        - 'restful apis'
    - canonical_id: MCP
      approval_date: '2026-09-26'
      defense: 'Dossier pairs the expansion and the acronym verbatim'
      variants:
        - 'model context protocol'
    - canonical_id: RAG
      approval_date: '2026-09-26'
      defense: 'Expansion of a verified acronym; positioning statement uses "retrieval-augmented systems"'
      variants:
        - 'retrieval-augmented generation'
        - 'retrieval augmented generation'
    - canonical_id: CHROMADB
      approval_date: '2026-09-26'
      defense: 'Vendor short form of the identical product'
      variants:
        - 'chroma'
    - canonical_id: BM25
      approval_date: '2026-09-26'
      defense: 'Formal name of the identical ranking function'
      variants:
        - 'okapi bm25'
    - canonical_id: PYTHON
      approval_date: '2026-09-26'
      defense: 'Version-qualified form; no generational split in the verified skill'
      variants:
        - 'python 3'
        - 'python3'
    - canonical_id: SQLITE
      approval_date: '2026-09-26'
      defense: 'Version-qualified form of the identical embedded database'
      variants:
        - 'sqlite3'
    - canonical_id: BASH
      approval_date: '2026-09-26'
      defense: 'Qualified form of the identical shell'
      variants:
        - 'bash shell'
  # Variant lookup keys the owner explicitly deferred. None may appear above.
  deferred_alias_variants:
    - 'crontab'
    - 'openssh'
    - 'js/ts'
    - 'javascript/typescript'
    - 'js'
    - 'ts'
    - 'react native'
    - 'ubuntu'
    - 'vector database'
  # Mappings recorded as deferred so they cannot be reintroduced as aliases.
  deferred_alias_mappings:
    - 'RAG -> LangChain'
    - 'MCP -> Azure OpenAI'
  # Alias kinds that are never permitted.
  deferred_alias_categories:
    - broad_category
    - related_technology
    - capability_phrase
    - hierarchy
    - implication
    - protocol_implementation_pair
    - fuzzy_match
    - semantic_match
    - embedding_match
    - llm_match
    - external_taxonomy_or_api_lookup

# Technology categories. Owner decision, 2026-09-26, PROVISIONAL.
#
# One boolean per category decides everything:
#
#   substitutable: true   - operating one member transfers to another. A CRM is a CRM: if you
#                           have run one, you can run another. A requirement met by a peer tool
#                           earns REDUCED credit, and the report always names the tool actually
#                           held, so nothing claims the requested tool.
#   substitutable: false  - membership transfers nothing. A Rust role needs Rust; knowing Python
#                           does not get you there, and it cannot be learned on the fly for the
#                           application. A miss here is a distinct red flag, not mere absence.
#
# `members` are the job-side names the category recognizes. Listing a name here is NOT candidate
# evidence: credit still requires the candidate to hold a member, in the approved dossier, at a
# disclosed tier.
technology_categories:
  substitution_credit:
    direct: 1.00
    substitute: 0.50
    none: 0.00
  categories:
    - name: CRM_TICKETING
      substitutable: true
      note: >-
        Employee-facing CRM and ticketing systems. All exist to get customer information to a
        person who can act on it. Operating one transfers to the others.
      members:
        - Salesforce
        - Monday
        - Monday.com
        - Freshdesk
        - Zendesk
        - Jira Service Management
        - ServiceNow
        - HubSpot
    - name: PROGRAMMING_LANGUAGE
      substitutable: false
      note: >-
        General-purpose programming languages. Market-standard across the industry, and not
        interchangeable: a language-specific role requires that language.
      members:
        - Python
        - JavaScript
        - TypeScript
        - Java
        - Kotlin
        - C#
        - Rust
        - Go
        - Ruby
        - PHP
        - Swift
        - Scala
        - C++

# A-7. Required-primary with preferred informational only, resolving
# required_vs_preferred_technology_handling. Preferred-technology extraction, its schema,
# and any capture-template change remain deferred. The compound ALL-OF slot for JS/TS is
# recorded as policy and is not implemented. No behaviour is implemented; this block is
# policy data only.
required_vs_preferred_technology_handling:
  required_only_dimension_input: true
  preferred_score_effect: none
  preferred_classification_effect: none
  preferred_recommendation_effect: none
  preferred_flag_effect: none
  preferred_raises_required_skill_gap: false
  preferred_evidence_map_required: true
  preferred_influences_human_next_action_wording_only: true
  no_explicit_required_technologies_points: 0
  any_of_slot_count: 1
  equivalent_may_introduce_new_technology: false
  generic_wording_becomes_slot: false
  critical_unknown_when_structured_field_yields_no_technology: true
  compound_all_of_slot: deferred
  preferred_extraction: deferred

# Policy decisions required before any deterministic assessment behaviour may be
# implemented or executed. Structural loading succeeds; readiness validation fails
# while any key appears below. No value may be invented.
#
# UNRESOLVED is the ONLY value permitted here, enforced by schema validation. A key is not
# resolved by changing its value: it is resolved by removing it from this block and from
# REQUIRED_UNRESOLVED_POLICY_KEYS, and adding a typed policy block carrying its own status.
#
# A-5, A-6, and A-7 were resolved that way by the 2026-09-26 technology-matching record.
#
# Six allocation-rule keys were added by the 2026-09-26 dimension-allocation record. They
# cover the six dimensions that hold approved weights but no rule for turning facts into
# points - 55 of the 100 points. They were previously missing from this gate entirely, which
# made that gap invisible.
unresolved_policy:
  seniority_band_selection_precedence: UNRESOLVED
  compensation_range_selection_rule: UNRESOLVED
  critical_unknown_detection_rule: UNRESOLVED
  score_rounding_rule: UNRESOLVED
  report_and_cli_score_display_scope: UNRESOLVED
  role_family_allocation_rule: UNRESOLVED
  responsibility_evidence_allocation_rule: UNRESOLVED
  location_remote_relocation_allocation_rule: UNRESOLVED
  employment_type_allocation_rule: UNRESOLVED
  employer_listing_validation_allocation_rule: UNRESOLVED
  growth_learning_allocation_rule: UNRESOLVED
