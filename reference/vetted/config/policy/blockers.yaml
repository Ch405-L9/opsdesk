# CareerOps Local - hard blocker policy (owner decisions D-5, D-6, D-8, D-10).
# Phase 1A ships this as configuration only. No blocker logic is implemented.
#
# Deliberately absent: any salary-override key. An override for explicit base salary below
# 80,000 is deferred to a later, separately approved phase (D-10).

# D-8: owner-reviewable degree-equivalency phrase list. Matching is case-insensitive when
# implemented. An explicit mandatory degree with none of these phrases is a hard blocker;
# with any of these phrases it is not. Ambiguous wording yields INSUFFICIENT_EVIDENCE.
degree_equivalency_phrases:
  - or equivalent experience
  - or equivalent practical experience
  - or equivalent professional experience
  - or equivalent work experience
  - or related experience
  - equivalent combination of education and experience
  - education or equivalent experience
  - degree preferred
  - bachelor's preferred
  - or demonstrable experience

# The complete hard blocker set. Work authorization is deliberately NOT a blocker (D-5), and
# plain absence of company evidence is deliberately NOT a blocker (D-6).
blockers:
  - code: CLEARANCE_REQUIRED_WITHOUT_CANDIDATE_EVIDENCE
    enabled: true
  - code: MANDATORY_DEGREE_WITHOUT_EQUIVALENCY
    enabled: true
  # Disabled by owner decision 2026-09-26: the salary floor is soft. A listing below the
  # recorded figure scores zero and is reported with its shortfall, never dropped. The code
  # remains defined because the blocker set is parity-locked to PROJECT_GUARDRAILS.md.
  - code: EXPLICIT_BASE_SALARY_BELOW_80K
    enabled: false
  - code: RESEARCH_HEAVY_UNVERIFIED_QUALIFICATIONS
    enabled: true
  - code: SENIOR_SCOPE_MATERIALLY_UNSUPPORTED
    enabled: true
  - code: PAYMENT_OR_IDENTITY_REQUEST
    enabled: true
  - code: AFFIRMATIVE_COMPANY_IDENTITY_CONTRADICTION
    enabled: true

# P-5: firing conditions for SENIOR_SCOPE_MATERIALLY_UNSUPPORTED.
# Owner decision recorded in docs/SCORING_DECISIONS.md (2026-09-25).
#
# The blocker fires ONLY when BOTH conditions hold:
#   1. the role is explicitly senior scope, AND
#   2. at least two of the enumerated categories are materially unsupported.
# A senior title alone is a SENIORITY_MISMATCH concern, never an automatic blocker.
# P-3's 0-point seniority band and this blocker are NOT equivalent: a role may score 0
# for seniority without firing this blocker.
senior_scope:
  requires_explicit_senior_scope: true
  minimum_unsupported_requirements: 2
  senior_title_tokens:
    - Senior
    - Staff
    - Principal
    - Lead
    - Head
  unsupported_requirement_categories:
    - leadership_or_ownership
    - five_plus_years_required
    - mlops_cloud_or_platform_ownership
    - kubernetes_terraform_docker_core
    - research_training_or_publications
    - unsupported_scale_or_ownership_claims
    - clearance_or_independent_blocker
