# CareerOps Local - compensation policy (owner decision D-3, A-2).
# Bands use an inclusive lower bound and an exclusive upper bound, in USD base salary.
# They must tile the whole range with no gap and no overlap.
# Point values are owner decision P-4, recorded in docs/SCORING_DECISIONS.md (2026-09-25).
# No compensation scoring logic is implemented.

currency: USD

bands:
  - classification: BELOW_80K
    min_usd: null
    max_usd: 80000
    hard_blocker: false
    points: 0
    report_note: >-
      Below the 80,000 figure recorded in the dossier. No longer a hard blocker: owner decision
      2026-09-26 made the floor soft, because a few thousand under a stated minimum can still be
      a good opportunity and is a judgement for a human, not an automatic rejection. Scores zero
      in this dimension and is reported with its distance from the soft minimum. See
      salary_targets below and docs/VALIDATION_QUEUE.md VQ-003.

  - classification: FALLBACK_80K_TO_85K
    min_usd: 80000
    max_usd: 86000
    hard_blocker: false
    points: 5
    report_note: >-
      Within the documented fallback band of 80,000 to 85,999. Acceptable when the role is
      substantively valuable.

  - classification: BELOW_PREFERRED_REVIEW
    min_usd: 86000
    max_usd: 90000
    hard_blocker: false
    points: 7
    report_note: >-
      Below Anthony's preferred 90,000 base target but above the 80,000 exclusion floor. Not a
      hard blocker and not a salary conflict. No risk flag is raised for this band.

  - classification: TARGET_90K_PLUS
    min_usd: 90000
    max_usd: null
    hard_blocker: false
    points: 10
    report_note: >-
      At or above the preferred 90,000 base target.

# Hourly and contract compensation is never annualized and never equated to salary.
contract_points: 0
contract_handling: >-
  Classify as CONTRACT_REQUIRES_REVIEW. Never annualize an hourly rate and never treat
  contract compensation as equivalent to salaried compensation. Evaluate separately.

# Absent compensation is missing evidence, not negative evidence.
unknown_points: 0
unknown_handling: >-
  Classify as UNKNOWN and raise MISSING_COMPENSATION. Never reject a listing solely because
  compensation is absent.

# Salary targets. Owner decision, 2026-09-26, PROVISIONAL.
#
# Three numbers, deliberately. The bands above score the dimension; these describe where a
# listing sits relative to the owner's floor and to the market, which are two different
# questions. A listing can clear the floor and still be underpaying.
#
# hard_floor_usd    below this, not worth the owner's time. Still not a blocker: it scores zero
#                   and is reported, never silently dropped.
# soft_minimum_usd  the owner's stated minimum. A listing under it is shown with the shortfall.
# market_target_usd anchored to published market data, not to a personal preference. See
#                   market_reference for the source and as-of date.
salary_targets:
  hard_floor_usd: 70000
  soft_minimum_usd: 85000
  market_target_usd: 120000
  status: PROVISIONAL
  decided_on: '2026-09-26'
  note: >-
    hard_floor_usd and market_target_usd were proposed by the assistant and approved by the
    owner on 2026-09-26. soft_minimum_usd is the owner's own figure. The dossier still records a
    90,000 preference and an 80,000 exclusion; reconciling those is VQ-003.

# Market reference. Every row requires a source and an as-of date, and configuration loading
# rejects a row without them: an uncited market figure is a guess, and a guess about pay is
# worse than no figure at all.
market_reference:
  status: PROVISIONAL
  rows:
    - label: us_median_data_scientist_annual_usd
      value: 120230
      as_of: '2025-05'
      source: https://www.bls.gov/news.release/ocwage.t01.htm
      note: >-
        BLS Occupational Employment and Wage Statistics, national median for Data Scientists.
        Used as the conservative anchor because BLS publishes no Applied AI Engineer occupation.
        Self-reported salary sites quote materially higher figures, skewed to senior and large
        technology employers, and are not used here.
    - label: georgia_median_data_scientist_annual_usd
      value: 104340
      as_of: '2025-05'
      source: https://www.bls.gov/ooh/math/data-scientists.htm
      note: Georgia state median, for comparison against the national anchor.

# Regional price parity, for relocation comparisons only. US average is 100.
#
# Applied ONLY when a listing would require relocation. For a remote role the owner stays in
# Georgia, earns the listing's salary and spends at Georgia prices, so no adjustment is made:
# adjusting a remote salary downward would penalise the best offers.
regional_price_parity:
  status: PROVISIONAL
  us_average: 100
  as_of: '2024'
  source: https://www.bea.gov/data/prices-inflation/regional-price-parities-state-and-metro-area
  candidate_state: GA
  apply_only_on_relocation: true
  states:
    CA: 110.7
    HI: 110.0
    DC: 109.9
    NJ: 108.8
    NY: 107.9
    WA: 107.0
    MA: 105.8
    IL: 100.0
    TX: 97.1
    GA: 96.3
    NC: 94.3
    IA: 87.8
    OK: 87.8
    MS: 87.0
    AR: 86.9
  note: >-
    BEA Regional Price Parities, 2024, the most recent released year. Only states individually
    verified against a published figure are listed. An unlisted state yields no adjustment rather
    than an interpolated guess, so the list is safe to extend one verified state at a time.
    Atlanta metro is 100.1, essentially the national average, so no cost-of-living argument
    supports discounting a Georgia-based candidate. States not yet verified include CO, FL, VA,
    AZ, OR and UT; an on-site listing in one of those reports that no parity is published rather
    than guessing.
