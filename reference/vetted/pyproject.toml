[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vetted"
version = "0.1.0.dev2"
description = "Local-first job copilot: checks postings, ties every resume line to evidence, and never submits."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
  { name = "BADGRTechnologies LLC" }
]
keywords = [
  "local-llm",
  "rag",
  "resume",
  "job-application",
  "safety",
  "human-in-the-loop"
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed"
]
dependencies = [
  "email-validator>=2.2,<3.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "PyYAML>=6.0,<7.0",
  "rich>=13.9,<15.0",
  "typer>=0.15,<1.0"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2.0",
  "pre-commit>=4.0,<5.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.9,<1.0",
  "types-PyYAML>=6.0.12.20241230"
]

[project.scripts]
vetted = "vetted.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vetted"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --cov=vetted --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["vetted"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tests/core"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# The × sign is intentional in score formulas; pairwise() rewrites are deferred.
ignore = ["RUF001", "RUF002", "RUF007", "RUF043", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"src/vetted/cli.py" = ["B008"]
"tests/**" = ["E501"]
"scripts/**" = ["E501"]
"src/vetted/retrieval/prepare.py" = ["B007", "B905"]
